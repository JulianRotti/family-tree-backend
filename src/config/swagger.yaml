openapi: 3.0.0
info:
  title: Family Tree API
  version: 1.0.0
  description: API to manage family trees and relationships.

paths:
  /api/family/members:
    get:
      summary: Retrieve all family members
      description: Fetches all family members from the database.
      responses:
        200:
          description: A list of family members.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Member'
        500:
          description: Failed to fetch members.

    post:
      summary: Create a new family member
      description: Adds a new member to the family.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberInput'
      responses:
        201:
          description: Created a new family member.
        400:
          description: Validation error - missing or invalid fields.
        500:
          description: Failed to create member.

  /api/family/relationships:
    get:
      summary: Retrieve all relationships
      description: Fetches all relationships between family members.
      responses:
        200:
          description: A list of relationships.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Relationship'
        500:
          description: Failed to fetch relationships.

    post:
      summary: Create a new relationship
      description: Adds a new relationship between family members.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RelationshipInput'
      responses:
        201:
          description: Created a new relationship.
        400:
          description: Validation error - invalid relationship or duplicate.
        500:
          description: Failed to create relationship.

  /api/family/family-tree/{id}:
    get:
      summary: Retrieve family tree by member ID
      description: Fetches the family tree structure for a given member ID.
      parameters:
        - in: path
          name: id
          required: true
          description: ID of the member whose family tree is being fetched.
          schema:
            type: integer
        - in: query
          name: w_node
          required: false
          description: Width of a node in the family tree.
          schema:
            type: integer
        - in: query
          name: w_partner
          required: false
          description: Space between the node and its spouse.
          schema:
            type: integer
        - in: query
          name: w_children
          required: false
          description: Space between children in the family tree.
          schema:
            type: integer
      responses:
        200:
          description: Family tree structure.
          content:
            application/json:
              schema:
                type: object
                properties:
                  familyTreeById:
                    $ref: '#/components/schemas/MemberTree'
                  members:
                    type: array
                    items:
                      $ref: '#/components/schemas/Member'
        400:
          description: Invalid ID format.
        500:
          description: Failed to fetch family tree.

components:
  schemas:
    Member:
      type: object
      properties:
        id:
          type: integer
        first_name:
          type: string
          example: "John"
        last_name:
          type: string
          example: "Doe"
        initial_last_name:
          type: string
          nullable: true
          example: "Smith"
        birth_date:
          type: string
          format: date
          example: "1990-01-01"
        death_date:
          type: string
          format: date
          nullable: true
          example: "2070-01-01"
        birth_city:
          type: string
          example: "Berlin"
        birth_country:
          type: string
          example: "Germany"
        email:
          type: string
          format: email
          example: "john.doe@example.com"
        telephone:
          type: string
          pattern: "^[0-9+\\s()-]{7,20}$"
          example: "+49 30 12345678"
        street_number:
          type: string
          example: "Hauptstraße 12"
        plz:
          type: string
          example: "10115"
        city:
          type: string
          example: "Berlin"

    MemberInput:
      type: object
      required:
        - first_name
        - last_name
        - birth_date
        - birth_city
        - birth_country
      properties:
        first_name:
          type: string
          example: "John"
        last_name:
          type: string
          example: "Doe"
        initial_last_name:
          type: string
          nullable: true
          example: "Smith"
        birth_date:
          type: string
          format: date
          example: "1990-01-01"
        death_date:
          type: string
          format: date
          nullable: true
          example: "2070-01-01"
        birth_city:
          type: string
          example: "Berlin"
        birth_country:
          type: string
          example: "Germany"
        email:
          type: string
          format: email
          example: "john.doe@example.com"
        telephone:
          type: string
          pattern: "^[0-9+\\s()-]{7,20}$"
          example: "+49 30 12345678"
        street_number:
          type: string
          example: "Hauptstraße 12"
        plz:
          type: string
          example: "10115"
        city:
          type: string
          example: "Berlin"

    Relationship:
      type: object
      properties:
        member_1_id:
          type: integer
          example: 1
        member_2_id:
          type: integer
          example: 2
        relationship:
          type: string
          enum:
            - parent
            - spouse
          example: "parent"

    RelationshipInput:
      type: object
      required:
        - member_1_id
        - member_2_id
        - relationship
      properties:
        member_1_id:
          type: integer
          example: 1
        member_2_id:
          type: integer
          example: 2
        relationship:
          type: string
          enum:
            - parent
            - spouse
          example: "parent"

    MemberTree:
      type: object
      properties:
        id:
          type: integer
          example: 1
        subtree_len:
          type: integer
          example: 100
        family:
          type: array
          items:
            type: object
            properties:
              spouse:
                type: integer
                example: 2
              children:
                type: array
                items:
                  $ref: '#/components/schemas/MemberTree'
